<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לוח הדבקה">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1f2e" id="themeColor">
<meta name="color-scheme" content="dark light">
<meta name="format-detection" content="telephone=no">
<title>לוח הדבקה</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=6">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --bg:#1a1f2e; --bg2:#222839; --card:#283046; --card2:#323b55; --line:rgba(255,255,255,.14);
  --text:#ffffff; --mute:#b4bcd2; --acc:#5b8cff; --acc2:#9b5cff; --ok:#34d399; --warn:#ff6b6b;
  --glass:rgba(26,31,46,.80); --shadow:0 10px 30px rgba(0,0,0,.35);
  --grad:linear-gradient(135deg,#3b82ff 0%,#6d5dfc 55%,#b05cff 100%);
  --r:18px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4fa; --bg2:#eceef7; --card:#ffffff; --card2:#f5f6fb; --line:rgba(20,24,50,.08);
    --text:#14172b; --mute:#6a7088; --glass:rgba(243,244,250,.78); --shadow:0 10px 30px rgba(40,50,110,.12);
  }
}
:root[data-theme="light"]{
  --bg:#f3f4fa; --bg2:#eceef7; --card:#ffffff; --card2:#f5f6fb; --line:rgba(20,24,50,.08);
  --text:#14172b; --mute:#6a7088; --glass:rgba(243,244,250,.78); --shadow:0 10px 30px rgba(40,50,110,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(120% 60% at 100% -10%,rgba(91,140,255,.30),transparent 60%),
    radial-gradient(90% 50% at 0% 0%,rgba(155,92,255,.24),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:calc(env(safe-area-inset-bottom) + 40px);
  -webkit-user-select:none;user-select:none;
  overscroll-behavior-y:none;
}
button,input,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* Header */
header.top{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
header.top.scrolled{border-bottom-color:var(--line)}
.bar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;box-shadow:0 6px 16px rgba(91,92,255,.35)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.2px}
.ttl small{display:block;color:var(--mute);font-size:14.5px;margin-top:1px}
.iconbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text);transition:transform .15s,background .2s}
.iconbtn:active{transform:scale(.92)}

/* Hero */
.hero{display:flex;gap:10px;margin:14px 0 0}
.paste{
  flex:1;position:relative;overflow:hidden;border-radius:22px;padding:18px 18px;
  display:flex;align-items:center;gap:14px;text-align:start;color:#fff;
  background:var(--grad);box-shadow:0 14px 34px rgba(98,92,255,.38),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s;
}
.paste:active{transform:scale(.975)}
.paste::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(120%);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
.paste .pi{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.paste .pi svg{width:26px;height:26px}
.paste b{display:block;font-size:21px;font-weight:800;letter-spacing:-.2px}
.paste span{display:block;font-size:15px;opacity:.85;margin-top:2px}
.kbd{width:64px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);transition:transform .15s}
.kbd:active{transform:scale(.94)}

/* Banner */
.banner{margin:14px 0 0;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;animation:rise .4s both}
.banner .bi{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.banner p{margin:0;font-size:15.5px;line-height:1.5}
.banner p b{display:block;font-size:17px;margin-bottom:2px}
.banner .x{margin-inline-start:auto;color:var(--mute);width:30px;height:30px;display:grid;place-items:center}

/* Search + chips */
.search{position:relative;margin:16px 0 0}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--mute);width:20px;height:20px}
.search input{
  width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);
  padding-inline:46px 14px;font-size:18px;outline:none;-webkit-user-select:text;user-select:text;transition:border-color .2s,box-shadow .2s;
}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(91,140,255,.18)}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;font-size:16px;font-weight:600;color:var(--mute);background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;transition:all .2s}
.chip svg{width:17px;height:17px}
.chip.on{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 6px 16px rgba(98,92,255,.35)}
.chip em{font-style:normal;opacity:.75;font-weight:700;font-size:14px}

/* List */
.sec{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;color:var(--mute);font-size:15px;font-weight:700;letter-spacing:.3px}
.sec svg{width:17px;height:17px}
.card{
  position:relative;display:flex;align-items:stretch;gap:0;margin:0 0 10px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset;overflow:hidden;
  animation:rise .35s both;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s;
}
.card:active{transform:scale(.985)}
.card.pin{border-color:rgba(91,140,255,.45);background:linear-gradient(180deg,rgba(91,140,255,.10),transparent 70%),var(--card)}
.card.copied{border-color:var(--ok);background:linear-gradient(180deg,rgba(52,211,153,.16),transparent 80%),var(--card)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.main{flex:1;min-width:0;display:flex;gap:14px;align-items:flex-start;padding:16px 14px;text-align:start}
.badge{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;color:#fff;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.badge svg{width:23px;height:23px}
.card.copied .badge{background:var(--ok)!important;transform:scale(1.1) rotate(-6deg)}
.t-link .badge{background:linear-gradient(135deg,#3b82ff,#22b8ff)}
.t-phone .badge{background:linear-gradient(135deg,#10b981,#34d399)}
.t-email .badge{background:linear-gradient(135deg,#f97316,#fbbf24)}
.t-number .badge{background:linear-gradient(135deg,#a855f7,#d946ef)}
.t-code .badge{background:linear-gradient(135deg,#475569,#64748b)}
.t-text .badge{background:linear-gradient(135deg,#6d5dfc,#8b7bff)}
.body{flex:1;min-width:0}
.txt{font-size:19px;line-height:1.45;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;white-space:pre-wrap;unicode-bidi:plaintext;text-align:start}
.t-link .txt{direction:ltr;text-align:left;-webkit-line-clamp:2;color:var(--acc)}
.t-link .txt b{color:var(--text);font-weight:700}
.t-code .txt,.t-number .txt,.t-phone .txt,.t-email .txt{direction:ltr;text-align:left}
.t-code .txt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}
.meta{margin-top:8px;font-size:14.5px;color:var(--mute);display:flex;gap:8px;align-items:center}
.meta i{width:3px;height:3px;border-radius:50%;background:var(--mute);opacity:.6}
.thumb{width:64px;height:64px;border-radius:15px;overflow:hidden;flex:none;position:relative;background:var(--card2);border:1px solid var(--line);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.card.copied .thumb{transform:scale(1.06) rotate(-4deg)}
.card.copied .thumb::after{content:"";position:absolute;inset:0;background:rgba(52,211,153,.9) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/32px no-repeat}
.badge.fx{font-size:13px;font-weight:800;letter-spacing:.4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.t-image .badge{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.t-image .txt,.t-file .txt{-webkit-line-clamp:2;font-size:18px;font-weight:600}
.sh-img{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:12px;display:grid;place-items:center;min-height:120px}
.sh-img img{max-width:100%;max-height:34dvh;border-radius:10px;display:block}
.sh-file{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sh-file .badge{width:56px;height:56px;border-radius:16px;color:#fff}
.sh-file b{display:block;font-size:18px;word-break:break-word;unicode-bidi:plaintext;text-align:start}
.sh-file span{color:var(--mute);font-size:15px}
.acts{display:flex;flex-direction:column;border-inline-start:1px solid var(--line)}
.acts button{flex:1;width:54px;display:grid;place-items:center;color:var(--mute);transition:color .2s,background .2s}
.acts button+button{border-top:1px solid var(--line)}
.acts button:active{background:var(--card2)}
.acts .on{color:var(--acc)}
.acts .on svg{fill:currentColor}

/* Empty */
.empty{text-align:center;padding:36px 12px 10px;color:var(--mute);animation:rise .5s both}
.empty .art{display:block;width:132px;height:132px;border-radius:30px;margin:0 auto 18px;filter:drop-shadow(0 18px 30px rgba(98,92,255,.35))}
.empty h2{margin:0 0 8px;color:var(--text);font-size:24px}
.empty p{margin:0 auto;max-width:320px;line-height:1.6;font-size:17px}
.steps{display:grid;gap:10px;margin:22px auto 0;max-width:340px;text-align:start}
.steps div{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px;font-size:16.5px;color:var(--text)}
.steps b{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}

/* Sheet */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(10,13,24,.5);opacity:0;pointer-events:none;transition:opacity .25s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#overlay.show{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:640px;margin:0 auto;max-height:88dvh;overflow:auto;
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);
}
#sheet.show{transform:none;box-shadow:0 -20px 50px rgba(0,0,0,.4)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px;filter:brightness(1.8)}
.sh-h{display:flex;align-items:center;gap:10px;margin:0 2px 14px}
.sh-h h3{margin:0;font-size:23px;flex:1}
.sh-prev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;line-height:1.5;margin-bottom:12px;max-height:120px;overflow:hidden;white-space:pre-wrap;word-break:break-word;unicode-bidi:plaintext;text-align:start;color:var(--mute)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:17px 16px;font-size:18px;text-align:start;transition:background .15s}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--card2)}
.row svg{color:var(--acc)}
.row.danger{color:var(--warn)}.row.danger svg{color:var(--warn)}
.row small{margin-inline-start:auto;color:var(--mute);font-size:15px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-inline-start:auto;gap:2px}
.seg button{padding:8px 14px;border-radius:10px;font-size:16px;font-weight:600;color:var(--mute);transition:all .2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(98,92,255,.35)}
.sw{margin-inline-start:auto;width:52px;height:32px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--ok);border-color:transparent}
.sw.on::after{transform:translateX(-20px)}
.label{margin:20px 6px 8px;color:var(--mute);font-size:15px;font-weight:700}
.note{margin:8px 6px 0;color:var(--mute);font-size:15px;line-height:1.55}
textarea.big{width:100%;min-height:130px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:14px;font-size:18px;outline:none;resize:none;-webkit-user-select:text;user-select:text;unicode-bidi:plaintext;text-align:start}
textarea.big:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(91,140,255,.18)}
.cta{width:100%;margin-top:12px;height:56px;border-radius:18px;color:#fff;font-weight:800;font-size:19px;background:var(--grad);box-shadow:0 10px 24px rgba(98,92,255,.35);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta.sec2{background:var(--card);color:var(--text);box-shadow:none;border:1px solid var(--line)}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);z-index:80;transform:translate(-50%,30px) scale(.96);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:999px;font-size:17px;font-weight:700;
  background:var(--text);color:var(--bg);box-shadow:0 14px 34px rgba(0,0,0,.4);transition:all .3s cubic-bezier(.2,.9,.25,1);white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#toast svg{width:20px;height:20px;color:var(--ok)}
#toast button{color:var(--acc);font-weight:800;padding:2px 4px}
.foot{text-align:center;color:var(--mute);font-size:14px;margin:20px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="bar">
    <img class="logo" src="icon-180.png?v=6" alt="">
    <div class="ttl"><h1>לוח הדבקה</h1><small id="sub">&nbsp;</small></div>
    <button class="iconbtn" data-a="settings" aria-label="הגדרות"><svg class="i" viewBox="0 0 24 24" id="i-settings"></svg></button>
  </div>
</header>

<div class="wrap">
  <div id="bannerSlot"></div>

  <div class="hero">
    <button class="paste" data-a="paste">
      <div class="pi"><svg class="i" viewBox="0 0 24 24" data-ic="clipboard"></svg></div>
      <div><b>הדבק מהלוח</b><span>שמור את מה שהעתקת עכשיו</span></div>
    </button>
    <button class="kbd" data-a="addMenu" aria-label="הוסף"><svg class="i" viewBox="0 0 24 24" data-ic="plus"></svg></button>
  </div>

  <div class="search">
    <svg class="i" viewBox="0 0 24 24" data-ic="search"></svg>
    <input type="search" id="q" placeholder="חיפוש בהיסטוריה" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="chips" id="chips"></div>

  <main id="list"></main>
  <div class="foot" id="foot"></div>
</div>

<div id="overlay" data-a="close"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" multiple hidden>
<input type="file" id="imgIn" accept="image/*" multiple hidden>

function svg(n,cls){ return '<svg class="i '+(cls||'')+'" viewBox="0 0 24 24">'+(IC[n]||'')+'</svg>'; }
function hydrateIcons(root){
  (root||document).querySelectorAll('svg[data-ic]').forEach(function(s){ s.innerHTML = IC[s.getAttribute('data-ic')] || ''; });
  var st = document.getElementById('i-settings'); if(st) st.innerHTML = IC.settings;

/* ---------- State ---------- */
var KEY = 'clip-board-v1', SKEY = 'clip-settings-v1';
var settings = Object.assign({theme:'auto', max:50, auto:false, hint:false}, readJSON(SKEY, {}));
var items = readJSON(KEY, []);
if(!Array.isArray(items)) items = [];
var filter = 'all', query = '', current = null, sheetBlob = null, sheetUrl = null, pendingDrop = null, lastDeleted = null, toastT = null, copiedId = null;
var $ = function(id){ return document.getElementById(id); };
var listEl = $('list'), chipsEl = $('chips'), sheet = $('sheet'), sheetBody = $('sheetBody'), overlay = $('overlay'), toastEl = $('toast');

function readJSON(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
function writeJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function save(){ writeJSON(KEY, items); }
function saveSettings(){ writeJSON(SKEY, settings); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function byId(id){ return items.find(function(i){ return i.id === id; }); }

/* ---------- Type detection ---------- */
var TYPES = {
  image:{label:'תמונות', one:'תמונה', ic:'image'},
  file: {label:'קבצים',  one:'קובץ',  ic:'file'},
  link:  {label:'קישורים', one:'קישור', ic:'link'},
  phone: {label:'טלפונים', one:'טלפון', ic:'phone'},
  email: {label:'מיילים',  one:'מייל',  ic:'mail'},
  number:{label:'מספרים',  one:'מספר',  ic:'number'},
  code:  {label:'קוד',     one:'קוד',   ic:'code'},
  text:  {label:'טקסט',    one:'טקסט',  ic:'text'}
};
function detect(t){
  var s = t.trim();
  if(/^(https?:\/\/|www\.)\S+$/i.test(s)) return 'link';
  if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s)) return 'email';
  var digits = s.replace(/\D/g,'');
  if(/^[+()\d\s.\-]{7,20}$/.test(s) && digits.length >= 7 && digits.length <= 15 && /^(\+|0)/.test(s)) return 'phone';
  if(/^-?[\d.,\s]+$/.test(s) && /\d/.test(s)) return 'number';
  if(/[{};]|=>|<\/?[a-z][^>]*>|^\s*(function|const|let|var|import|def|class|SELECT|INSERT)\b/m.test(s) && /[\n{;}]/.test(s)) return 'code';
  return 'text';
}
function linkUrl(t){ t = t.trim(); return /^https?:\/\//i.test(t) ? t : 'https://' + t; }
function hostOf(t){ try { var u = new URL(linkUrl(t)); return {h:u.host.replace(/^www\./,''), r:(u.pathname + u.search + u.hash).replace(/^\/$/,'')}; } catch(e){ return {h:t, r:''}; } }

function ago(ts){
  var d = (Date.now() - ts) / 1000;
  if(d < 45) return 'עכשיו';
  if(d < 3600) return 'לפני ' + Math.round(d/60) + ' דק׳';
  if(d < 86400){ var h = Math.round(d/3600); return h === 1 ? 'לפני שעה' : 'לפני ' + h + ' שע׳'; }
  if(d < 172800) return 'אתמול';
  if(d < 604800) return 'לפני ' + Math.floor(d/86400) + ' ימים';
  return new Date(ts).toLocaleDateString('he-IL', {day:'numeric', month:'short'});
}

/* ---------- Core ops ---------- */
function trim(){
  var before = items.slice();
  var pinned = items.filter(function(i){ return i.pin; });
  var rest = items.filter(function(i){ return !i.pin; }).sort(function(a,b){ return b.ts - a.ts; }).slice(0, settings.max);
  items = pinned.concat(rest);
  before.forEach(function(i){ if(i.kind && items.indexOf(i) === -1) dropBlob(i.id); });
}
function add(text){
  text = (text || '').replace(/\s+$/, '').replace(/^\n+/, '');
  if(!text.trim()) return 'empty';
  var ex = items.find(function(i){ return !i.kind && i.t === text; });
  if(ex){ ex.ts = Date.now(); save(); render(); return 'bumped'; }
  items.push({id: uid(), t: text, ts: Date.now(), pin: false});
  trim(); save(); render();
  return 'added';
}

function copyText(text){
  var ok = false;
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;-webkit-user-select:text;user-select:text';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch(e){}
  if(ok) return Promise.resolve(true);
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return false; });
  return Promise.resolve(false);
}
function doCopy(it){
  var p = it.kind === 'image' ? copyImage(it) : copyText(it.t);   // חייב להיקרא סינכרונית בתוך לחיצה (דרישת iOS)
  it.ts = Date.now(); save();
  copiedId = it.id;
  var card = listEl.querySelector('[data-id="'+it.id+'"]');
  if(card){ card.classList.add('copied'); var b = card.querySelector('.badge'); if(b) b.innerHTML = svg('check'); }
  p.then(function(ok){ toast(ok ? 'הועתק, אפשר להדביק' : 'ההעתקה נכשלה', ok ? 'check' : null); });
  setTimeout(function(){ copiedId = null; render(); }, 1100);
}

/* ---------- Blob storage (IndexedDB) ---------- */
var MAX_FILE = 25 * 1024 * 1024, MAX_TOTAL = 300 * 1024 * 1024, dbp = null;
function db(){
  if(!dbp) dbp = new Promise(function(res, rej){
    if(!window.indexedDB){ rej(new Error('no idb')); return; }
    var r = indexedDB.open('clip-blobs', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('b'); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
  return dbp;
}
function tx(mode, fn){
  return db().then(function(d){ return new Promise(function(res, rej){
    var t = d.transaction('b', mode), rq = fn(t.objectStore('b'));
    t.oncomplete = function(){ res(rq && rq.result); };
    t.onerror = t.onabort = function(){ rej(t.error); };
  }); });
}
function putBlob(id, b){ return tx('readwrite', function(s){ return s.put(b, id); }); }
function getBlob(id){ return tx('readonly', function(s){ return s.get(id); }); }
function delBlob(id){ return tx('readwrite', function(s){ return s.delete(id); }); }
function dropBlob(id){ delBlob(id).catch(function(){}); }
function flushDrop(){ if(pendingDrop){ clearTimeout(pendingDrop.t); dropBlob(pendingDrop.id); pendingDrop = null; } }
function scheduleDrop(id){ flushDrop(); pendingDrop = {id: id, t: setTimeout(flushDrop, 8000)}; }
function cancelDrop(id){ if(pendingDrop && pendingDrop.id === id){ clearTimeout(pendingDrop.t); pendingDrop = null; } }
function cleanOrphans(){
  db().then(function(){ return tx('readonly', function(s){ return s.getAllKeys(); }); }).then(function(keys){
    var ids = {}; items.forEach(function(i){ ids[i.id] = 1; });
    (keys || []).forEach(function(k){ if(!ids[k]) dropBlob(k); });
  }).catch(function(){});
}

function ltr(x){ return '<bdi dir="ltr">' + x + '</bdi>'; }
function fmtSize(b){ if(b < 1024) return b + ' B'; if(b < 1048576) return Math.round(b/1024) + ' KB'; return (b/1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB'; }
function blobStats(){ var n = 0, sz = 0; items.forEach(function(i){ if(i.kind){ n++; sz += i.size || 0; } }); return n ? n + ' · ' + ltr(fmtSize(sz)) : 'אין'; }
function extFromMime(m){ var x = (m || '').split('/')[1] || ''; x = x.split(';')[0].split('+')[0]; return ({jpeg:'jpg'})[x] || x || 'bin'; }
function extOf(it){ var m = /\.([A-Za-z0-9]{1,5})$/.exec(it.t || ''); return m ? m[1].toLowerCase() : extFromMime(it.mime).slice(0,4); }
var GRAD = [
  [/^pdf$/, '#ef4444,#f97316'], [/^(docx?|rtf|txt|pages|odt)$/, '#3b82f6,#60a5fa'], [/^(xlsx?|csv|numbers|ods)$/, '#10b981,#34d399'],
  [/^(pptx?|key)$/, '#f97316,#fbbf24'], [/^(zip|rar|7z|gz|tar)$/, '#a16207,#d97706'], [/^(mp3|wav|m4a|aac|flac)$/, '#a855f7,#d946ef'],
  [/^(mp4|mov|avi|mkv|webm)$/, '#ec4899,#f43f5e']
];
function fileGrad(ext){ var g = '#475569,#64748b'; GRAD.forEach(function(r){ if(r[0].test(ext)) g = r[1]; }); return 'linear-gradient(135deg,' + g + ')'; }
function stamp(){ var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; }; return d.getDate() + '-' + (d.getMonth()+1) + ' ' + p(d.getHours()) + '.' + p(d.getMinutes()); }

function loadImg(blob){
  return new Promise(function(res, rej){
    var u = URL.createObjectURL(blob), im = new Image();
    im.onload = function(){ URL.revokeObjectURL(u); res(im); };
    im.onerror = function(){ URL.revokeObjectURL(u); rej(new Error('img')); };
    im.src = u;
  });
}
function makeThumb(blob){
  return loadImg(blob).then(function(im){
    var k = Math.min(1, 160 / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.72);
  });
}
function toPng(blob){
  return loadImg(blob).then(function(im){
    var c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
    c.getContext('2d').drawImage(im, 0, 0);
    return new Promise(function(res, rej){ c.toBlob(function(b){ b ? res(b) : rej(new Error('png')); }, 'image/png'); });
  });
}
// ClipboardItem מקבל Promise, כך שהקריאה נשארת סינכרונית בתוך הלחיצה (דרישת iOS)
function copyImage(it){
  if(!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) return Promise.resolve(false);
  try {
    var pr = getBlob(it.id).then(function(b){ if(!b) throw new Error('missing'); return b.type === 'image/png' ? b : toPng(b); });
    return navigator.clipboard.write([new ClipboardItem({'image/png': pr})]).then(function(){ return true; }, function(){ return false; });
  } catch(e){ return Promise.resolve(false); }
}

function addBlob(blob, name, kind){
  if(!blob || !blob.size) return Promise.resolve('empty');
  if(blob.size > MAX_FILE) return Promise.resolve('big');
  var total = items.reduce(function(a, i){ return a + (i.size || 0); }, 0);
  if(total + blob.size > MAX_TOTAL) return Promise.resolve('full');
  var mime = blob.type || '';
  if(kind === 'auto') kind = /^image\//.test(mime) ? 'image' : 'file';
  var th = kind === 'image' ? makeThumb(blob).catch(function(){ return ''; }) : Promise.resolve('');
  return th.then(function(thumb){
    var ex = items.find(function(i){ return i.kind === kind && i.size === blob.size && (kind === 'image' ? (thumb && i.thumb === thumb) : i.t === name); });
    if(ex){ ex.ts = Date.now(); save(); render(); return 'bumped'; }
    var id = uid();
    return putBlob(id, blob).then(function(){
      items.push({id: id, kind: kind, t: name, mime: mime, size: blob.size, thumb: thumb, ts: Date.now(), pin: false});
      trim(); save(); render();
      try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
      return 'added';
    }, function(){ return 'error'; });
  });
}
function reportBlob(r, silent){
  if(r === 'added') toast(silent ? 'נקלט מהלוח' : 'נשמר', 'check');
  else if(r === 'bumped'){ if(!silent) toast('כבר קיים, עלה לראש', 'check'); }
  else if(silent) return;
  else if(r === 'big') toast('הקובץ גדול מדי, המקסימום 25 מגה');
  else if(r === 'full') toast('אין מקום, מחק כמה קבצים');
  else toast('השמירה נכשלה');
}
function handleFiles(list){
  var files = Array.prototype.slice.call(list || []);
  if(!files.length) return;
  var res = {added: 0, bumped: 0, big: 0, full: 0, error: 0, empty: 0};
  files.reduce(function(p, f){
    return p.then(function(){ return addBlob(f, f.name || ('קובץ ' + stamp()), 'auto').then(function(r){ res[r]++; }); });
  }, Promise.resolve()).then(function(){
    if(res.added) toast(res.added === 1 ? 'נשמר' : 'נשמרו ' + res.added + ' פריטים', 'check');
    else if(res.bumped) toast('כבר קיים, עלה לראש', 'check');
    else if(res.big) toast('הקובץ גדול מדי, המקסימום 25 מגה');
    else if(res.full) toast('אין מקום, מחק כמה קבצים');
    else toast('השמירה נכשלה');
  });
}

/* ---------- Render ---------- */
function typeOf(i){ return i.kind === 'image' ? 'image' : i.kind === 'file' ? 'file' : detect(i.t); }

function render(){
  // chips
  var counts = {}, pinCount = 0;
  items.forEach(function(i){ var t = typeOf(i); counts[t] = (counts[t]||0) + 1; if(i.pin) pinCount++; });
  var chips = '<button class="chip '+(filter==='all'?'on':'')+'" data-a="filter" data-v="all">'+svg('all')+'הכל <em>'+items.length+'</em></button>';
  if(pinCount) chips += '<button class="chip '+(filter==='pin'?'on':'')+'" data-a="filter" data-v="pin">'+svg('pin')+'מוצמדים <em>'+pinCount+'</em></button>';
  Object.keys(TYPES).forEach(function(k){
    if(counts[k]) chips += '<button class="chip '+(filter===k?'on':'')+'" data-a="filter" data-v="'+k+'">'+svg(TYPES[k].ic)+TYPES[k].label+' <em>'+counts[k]+'</em></button>';
  });
  if(filter !== 'all' && filter !== 'pin' && !counts[filter]) filter = 'all';
  if(filter === 'pin' && !pinCount) filter = 'all';
  chipsEl.style.display = items.length ? '' : 'none';
  $('q').parentNode.style.display = items.length ? '' : 'none';
  chipsEl.innerHTML = chips;

  $('sub').textContent = items.length ? items.length + ' פריטים שמורים' : 'ההיסטוריה שלך תופיע כאן';

  // filter list
  var term = query.trim().toLowerCase();
  var f = items.filter(function(i){
    if(term && i.t.toLowerCase().indexOf(term) === -1) return false;
    if(filter === 'pin') return i.pin;
    if(filter !== 'all') return typeOf(i) === filter;
    return true;
  });
  var pinned = f.filter(function(i){ return i.pin; }).sort(function(a,b){ return b.ts - a.ts; });
  var recent = f.filter(function(i){ return !i.pin; }).sort(function(a,b){ return b.ts - a.ts; });

  var html = '';
  if(!items.length){
    html = emptyState();
  } else if(!f.length){
    html = '<div class="empty"><h2>לא נמצא כלום</h2><p>נסה מילה אחרת או נקה את הסינון.</p></div>';
  } else {
    if(filter === 'all' && pinned.length && recent.length){
      html += '<div class="sec">'+svg('pin')+'מוצמדים</div>' + pinned.map(card).join('');
      html += '<div class="sec">'+svg('zap')+'אחרונים</div>' + recent.map(card).join('');
    } else {
      html += pinned.concat(recent).map(card).join('');
    }
  }
  listEl.innerHTML = html;
  $('foot').textContent = items.length ? 'הנתונים נשמרים במכשיר שלך בלבד' : '';
}

function card(i){
  var t = typeOf(i), T = TYPES[t], body, lead, meta, copied = copiedId === i.id;
  if(i.kind){
    if(i.kind === 'image'){
      lead = i.thumb ? '<div class="thumb"><img src="'+esc(i.thumb)+'" alt="" loading="lazy"></div>' : '<div class="badge">'+svg(copied ? 'check' : 'image')+'</div>';
    } else {
      var ex = extOf(i);
      lead = '<div class="badge fx" style="background:'+fileGrad(ex)+'">'+esc(ex.toUpperCase().slice(0,4))+'</div>';
    }
    body = '<div class="txt">'+esc(i.t)+'</div>';
    meta = '<span>'+T.one+'</span><i></i><span>'+ltr(fmtSize(i.size || 0))+'</span><i></i><span>'+ago(i.ts)+'</span>';
  } else {
    if(t === 'link'){
      var u = hostOf(i.t);
      body = '<div class="txt"><b>'+esc(u.h)+'</b>'+esc(u.r.length > 60 ? u.r.slice(0,60)+'…' : u.r)+'</div>';
    } else {
      body = '<div class="txt">'+esc(i.t.length > 400 ? i.t.slice(0,400)+'…' : i.t)+'</div>';
    }
    var extra = (t === 'text' || t === 'code') ? '<i></i><span>'+i.t.length+' תווים</span>' : '';
    lead = '<div class="badge">'+svg(copied ? 'check' : T.ic)+'</div>';
    meta = '<span>'+T.one+'</span><i></i><span>'+ago(i.ts)+'</span>'+extra;
  }
  return '<article class="card t-'+t+(i.pin?' pin':'')+(copied?' copied':'')+'" data-id="'+i.id+'">' +
    '<button class="main" data-a="copy">'+lead+'<div class="body">'+body+'<div class="meta">'+meta+'</div></div></button>' +
    '<div class="acts"><button data-a="pin" class="'+(i.pin?'on':'')+'" aria-label="הצמד">'+svg('pin')+'</button>' +
    '<button data-a="more" aria-label="עוד">'+svg('more')+'</button></div></article>';
}

function emptyState(){
  return '<div class="empty">' +
    '<img class="art" src="icon-512.png?v=6" alt="">' +
    '<h2>עוד אין העתקות</h2><p>כל מה שתעתיק באייפון, טקסט או תמונה, יישמר כאן, ותוכל להדביק אותו שוב בנגיעה אחת. אפשר להוסיף גם קבצים.</p>' +
    '<div class="steps">' +
    '<div><b>1</b>מעתיקים משהו בכל אפליקציה</div>' +
    '<div><b>2</b>פותחים את לוח ההדבקה ולוחצים "הדבק מהלוח"</div>' +
    '<div><b>3</b>בפעם הבאה מקישים על הפריט ומדביקים איפה שרוצים</div>' +
    '</div></div>';
}

/* ---------- Toast ---------- */
function toast(msg, icon, action){
  toastEl.innerHTML = (icon ? svg(icon) : '') + '<span>'+esc(msg)+'</span>' + (action ? '<button data-a="'+action.a+'">'+esc(action.label)+'</button>' : '');
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, action ? 4500 : 1800);
}

/* ---------- Sheets ---------- */
function openSheet(html){
  sheetBody.innerHTML = html;
  hydrateIcons(sheetBody);
  overlay.classList.add('show'); sheet.classList.add('show');
  sheet.scrollTop = 0;
}
function closeSheet(){ overlay.classList.remove('show'); sheet.classList.remove('show'); current = null; sheetBlob = null; if(sheetUrl){ URL.revokeObjectURL(sheetUrl); sheetUrl = null; } document.activeElement && document.activeElement.blur && document.activeElement.blur(); }

function row(a, ic, label, extra, cls){
  return '<button class="row '+(cls||'')+'" data-a="'+a+'">'+svg(ic)+'<span>'+label+'</span>'+(extra||'')+'</button>';
}

function itemSheet(it){
  if(it.kind) return blobSheet(it);
  current = it.id;
  var t = typeOf(it), rows = '';
  rows += row('copyS', 'copy', 'העתק');
  if(t === 'link') rows += row('open', 'external', 'פתח קישור');
  if(t === 'phone') rows += row('open', 'phone', 'התקשר');
  if(t === 'email') rows += row('open', 'mail', 'שלח מייל');
  rows += row('edit', 'edit', 'ערוך');
  rows += row('shareS', 'share', 'שתף');
  rows += row('pinS', 'pin', it.pin ? 'בטל הצמדה' : 'הצמד לראש');
  rows += row('delS', 'trash', 'מחק', '', 'danger');
  openSheet('<div class="sh-prev">'+esc(it.t.length > 300 ? it.t.slice(0,300)+'…' : it.t)+'</div><div class="list">'+rows+'</div>');
}

function editSheet(it){
  current = it.id;
  openSheet('<div class="sh-h"><h3>'+(it.kind ? 'שינוי שם' : 'עריכה')+'</h3></div><textarea class="big" id="editTa">'+esc(it.t)+'</textarea><button class="cta" data-a="saveEdit">שמור שינויים</button>');
  setTimeout(function(){ var ta = $('editTa'); if(ta){ ta.focus(); } }, 380);
}

function addSheet(){
  openSheet('<div class="sh-h"><h3>הוספה</h3><button class="iconbtn" data-a="close" aria-label="סגור">'+svg('x')+'</button></div><div class="list">' +
    row('pickImg','image','תמונה מהגלריה או מהמצלמה') + row('pickFile','file','קובץ מהקבצים') + row('manual','keyboard','הקלדה או הדבקה ידנית') +
    '</div><p class="note">תמונות וקבצים נשמרים רק במכשיר הזה, עד 25 מגה לקובץ.</p>');
}
function blobSheet(it){
  current = it.id; sheetBlob = null;
  var head, rows = '';
  if(it.kind === 'image'){
    head = '<div class="sh-img"><img id="shImg" alt="" src="'+(it.thumb ? esc(it.thumb) : '')+'"></div>';
    rows += row('copyS','copy','העתק תמונה') + row('shareS','share','שתף או שמור');
  } else {
    var ex = extOf(it);
    head = '<div class="sh-file"><div class="badge fx" style="background:'+fileGrad(ex)+'">'+esc(ex.toUpperCase().slice(0,4))+'</div><div><b>'+esc(it.t)+'</b><span>'+ltr(fmtSize(it.size || 0))+'</span></div></div>';
    rows += row('shareS','share','שתף או שמור בקבצים') + row('open','external','פתח');
  }
  rows += row('edit','edit','שנה שם') + row('pinS','pin', it.pin ? 'בטל הצמדה' : 'הצמד לראש') + row('delS','trash','מחק','','danger');
  openSheet(head + '<div class="list">'+rows+'</div>');
  getBlob(it.id).then(function(b){
    if(current !== it.id) return;
    sheetBlob = b || null;
    if(b && it.kind === 'image'){ sheetUrl = URL.createObjectURL(b); var im = $('shImg'); if(im) im.src = sheetUrl; }
  }).catch(function(){});
}
function blobFile(it){ var nm = it.t; if(!/\.[A-Za-z0-9]{1,5}$/.test(nm)) nm += '.' + extOf(it); return new File([sheetBlob], nm, {type: it.mime || sheetBlob.type}); }
function openBlob(it){
  if(!sheetBlob){ toast('רגע, טוען…'); return; }
  var u = URL.createObjectURL(new Blob([sheetBlob], {type: it.mime || sheetBlob.type}));
  window.open(u, '_blank');
  setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
}
function shareBlob(it){
  if(!sheetBlob){ toast('רגע, טוען…'); return; }
  var f = blobFile(it);
  if(navigator.share && navigator.canShare && navigator.canShare({files: [f]})){
    navigator.share({files: [f]}).catch(function(e){ if(e && e.name !== 'AbortError') toast('השיתוף נכשל'); });
  } else openBlob(it);
}

function manualSheet(msg){
  openSheet('<div class="sh-h"><h3>הוספה ידנית</h3></div>' +
    (msg ? '<p class="note" style="margin:0 2px 10px">'+msg+'</p>' : '') +
    '<textarea class="big" id="manualTa" placeholder="לחיצה ארוכה ← הדבק, או פשוט הקלד"></textarea><button class="cta" data-a="saveManual">שמור</button>');
  setTimeout(function(){ var ta = $('manualTa'); if(ta) ta.focus(); }, 380);
}

function seg(group, opts, cur){
  return '<div class="seg">' + opts.map(function(o){ return '<button data-a="'+group+'" data-v="'+o[0]+'" class="'+(String(cur)===String(o[0])?'on':'')+'">'+o[1]+'</button>'; }).join('') + '</div>';
}
function settingsSheet(){
  openSheet(
    '<div class="sh-h"><h3>הגדרות</h3><button class="iconbtn" data-a="close" aria-label="סגור">'+svg('x')+'</button></div>' +
    '<div class="list">' +
      '<div class="row">'+svg('moon')+'<span>מראה</span>'+seg('theme',[['auto','אוטו׳'],['dark','כהה'],['light','בהיר']],settings.theme)+'</div>' +
      '<div class="row">'+svg('layers')+'<span>כמות לשמירה</span>'+seg('max',[[25,'25'],[50,'50'],[100,'100']],settings.max)+'</div>' +
      '<button class="row" data-a="auto">'+svg('zap')+'<span>קליטה בפתיחה</span><span class="sw '+(settings.auto?'on':'')+'"></span></button>' +
    '</div>' +
    '<p class="note">קליטה בפתיחה: בכל פעם שחוזרים לאפליקציה היא תנסה לשמור את מה שהועתק. iOS יבקש לאשר "הדבק" בכל פעם.</p>' +
    '<div class="label">אחסון</div><div class="list"><div class="row">'+svg('layers')+'<span>תמונות וקבצים</span><small>'+blobStats()+'</small></div></div><p class="note">נשמרים רק במכשיר ולא נכללים בגיבוי.</p>' +
    '<div class="label">גיבוי</div>' +
    '<div class="list">' +
      row('backup','download','העתק גיבוי ללוח','<small>'+items.filter(function(i){ return !i.kind; }).length+' פריטי טקסט</small>') +
      row('restore','upload','שחזר מגיבוי') +
    '</div>' +
    '<div class="label">אזור זהירות</div>' +
    '<div class="list">'+row('clearAll','trash','מחק הכל (חוץ מהמוצמדים)','','danger')+'</div>'
  );
}
function restoreSheet(){
  openSheet('<div class="sh-h"><h3>שחזור מגיבוי</h3></div><p class="note" style="margin:0 2px 10px">הדבק כאן את טקסט הגיבוי. הפריטים יתווספו לקיימים.</p><textarea class="big" id="restoreTa" placeholder="הדבק גיבוי"></textarea><button class="cta sec2" data-a="restorePaste">הדבק מהלוח</button><button class="cta" data-a="doRestore">שחזר</button>');
}

/* ---------- Actions ---------- */
function captureClipboard(silent){
  var fail = function(){ if(!silent) manualSheet('iOS לא אישר גישה ללוח. הקש "הדבק" כשהוא מופיע, או הדבק כאן ידנית.'); };
  var reportText = function(r){
    if(r === 'added') toast(silent ? 'נקלט מהלוח' : 'נשמר', 'check');
    else if(r === 'bumped'){ if(!silent) toast('כבר קיים, עלה לראש', 'check'); }
    else if(!silent) toast('הלוח ריק');
  };
  var viaText = function(){
    if(navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(function(t){ reportText(add(t)); }, fail);
    else fail();
  };
  if(!(navigator.clipboard && navigator.clipboard.read)){ viaText(); return; }
  navigator.clipboard.read().then(function(list){
    var imgCi = null, imgType = null, txtCi = null;
    list.forEach(function(ci){
      var it = ci.types.filter(function(x){ return /^image\//.test(x); })[0];
      if(it && !imgCi){ imgCi = ci; imgType = it; }
      if(!txtCi && ci.types.indexOf('text/plain') > -1) txtCi = ci;
    });
    if(imgCi){
      imgCi.getType(imgType).then(function(b){ return addBlob(b, 'תמונה ' + stamp(), 'image'); }).then(function(r){ reportBlob(r, silent); });
    } else if(txtCi){
      txtCi.getType('text/plain').then(function(b){ return b.text(); }).then(function(t){ reportText(add(t)); });
    } else if(!silent) toast('הלוח ריק או בפורמט שלא נתמך');
  }, function(err){ if(err && err.name === 'NotAllowedError') fail(); else viaText(); });
}
function pasteFromClipboard(){ captureClipboard(false); }

function applyTheme(){
  var r = document.documentElement;
  if(settings.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', settings.theme);
  var light = settings.theme === 'light' || (settings.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  $('themeColor').setAttribute('content', light ? '#f3f4fa' : '#1a1f2e');
}

function act(a, v, el){
  var it = current ? byId(current) : null;
  var card = el.closest ? el.closest('.card') : null;
  var cardItem = card ? byId(card.getAttribute('data-id')) : null;
  switch(a){
    case 'paste': pasteFromClipboard(); break;
    case 'addMenu': addSheet(); break;
    case 'manual': manualSheet(); break;
    case 'pickImg': $('imgIn').click(); closeSheet(); break;
    case 'pickFile': $('fileIn').click(); closeSheet(); break;
    case 'settings': settingsSheet(); break;
    case 'close': closeSheet(); break;
    case 'filter': filter = v; render(); break;
    case 'copy': if(cardItem){ if(cardItem.kind === 'file') blobSheet(cardItem); else doCopy(cardItem); } break;
    case 'pin': if(cardItem){ cardItem.pin = !cardItem.pin; save(); render(); toast(cardItem.pin ? 'הוצמד לראש' : 'ההצמדה בוטלה', 'check'); } break;
    case 'more': if(cardItem) itemSheet(cardItem); break;
    case 'copyS': if(it){ var x = it; closeSheet(); doCopy(x); } break;
    case 'pinS': if(it){ it.pin = !it.pin; save(); closeSheet(); render(); toast(it.pin ? 'הוצמד לראש' : 'ההצמדה בוטלה', 'check'); } break;
    case 'edit': if(it) editSheet(it); break;
    case 'saveEdit':
      if(it){ var val = $('editTa').value.replace(/\s+$/,''); if(val.trim()){ it.t = val; it.ts = Date.now(); save(); closeSheet(); render(); toast('עודכן', 'check'); } else toast('אי אפשר לשמור ריק'); }
      break;
    case 'saveManual':
      var m = $('manualTa').value; var r = add(m);
      if(r === 'empty'){ toast('אין מה לשמור'); } else { closeSheet(); toast(r === 'added' ? 'נשמר' : 'כבר קיים, עלה לראש', 'check'); }
      break;
    case 'shareS':
      if(it && it.kind){ shareBlob(it); }
      else if(it){
        if(navigator.share){ navigator.share({text: it.t}).catch(function(){}); }
        else { var y = it; closeSheet(); doCopy(y); }
      }
      break;
    case 'open':
      if(it && it.kind){ openBlob(it); break; }
      if(it){
        var t = typeOf(it), s = it.t.trim();
        if(t === 'link') window.open(linkUrl(s), '_blank', 'noopener');
        else if(t === 'phone') location.href = 'tel:' + s.replace(/[^\d+]/g,'');
        else if(t === 'email') location.href = 'mailto:' + s;
      }
      break;
    case 'delS':
      if(it){
        lastDeleted = {item: it, idx: items.indexOf(it)};
        items = items.filter(function(i){ return i.id !== it.id; });
        if(it.kind) scheduleDrop(it.id);
        save(); closeSheet(); render();
        toast('נמחק', 'trash', {a:'undo', label:'בטל'});
      }
      break;
    case 'undo':
      if(lastDeleted){ cancelDrop(lastDeleted.item.id); items.push(lastDeleted.item); lastDeleted = null; save(); render(); toast('שוחזר', 'check'); }
      break;
    case 'theme': settings.theme = v; saveSettings(); applyTheme(); settingsSheet(); break;
    case 'max': settings.max = +v; saveSettings(); trim(); save(); render(); settingsSheet(); break;
    case 'auto': settings.auto = !settings.auto; saveSettings(); settingsSheet(); break;
    case 'backup':
      copyText(JSON.stringify({app:'clip-board', v:1, items: items.filter(function(i){ return !i.kind; })})).then(function(ok){ toast(ok ? 'הגיבוי הועתק ללוח' : 'ההעתקה נכשלה', ok ? 'check' : null); });
      break;
    case 'restore': restoreSheet(); break;
    case 'restorePaste':
      if(navigator.clipboard && navigator.clipboard.readText){ navigator.clipboard.readText().then(function(t){ $('restoreTa').value = t; }, function(){ toast('הדבק ידנית בתיבה'); }); }
      break;
    case 'doRestore':
      try {
        var d = JSON.parse($('restoreTa').value), list = Array.isArray(d) ? d : d.items, n = 0;
        if(!Array.isArray(list)) throw new Error('bad');
        list.forEach(function(o){
          if(o && typeof o.t === 'string' && o.t.trim() && !items.some(function(i){ return i.t === o.t; })){
            items.push({id: uid(), t: o.t, ts: +o.ts || Date.now(), pin: !!o.pin}); n++;
          }
        });
        trim(); save(); closeSheet(); render(); toast('שוחזרו ' + n + ' פריטים', 'check');
      } catch(e){ toast('הגיבוי לא תקין'); }
      break;
    case 'clearAll':
      if(confirm('למחוק את כל הפריטים שאינם מוצמדים?')){ items.forEach(function(i){ if(!i.pin && i.kind) dropBlob(i.id); }); items = items.filter(function(i){ return i.pin; }); save(); closeSheet(); render(); toast('נוקה', 'check'); }
      break;
    case 'dismissHint': settings.hint = true; saveSettings(); $('bannerSlot').innerHTML = ''; break;
  }
}

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-a]') : null;
  if(!el) return;
  if(el.id === 'overlay' && e.target !== overlay) return;
  act(el.getAttribute('data-a'), el.getAttribute('data-v'), el);
});

/* long-press על כרטיס פותח את התפריט */
(function(){
  var timer = null, sx = 0, sy = 0;
  listEl.addEventListener('touchstart', function(e){
    var c = e.target.closest('.card'); if(!c || e.target.closest('.acts')) return;
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    timer = setTimeout(function(){ var it = byId(c.getAttribute('data-id')); if(it){ timer = 'fired'; itemSheet(it); } }, 480);
  }, {passive:true});
  listEl.addEventListener('touchmove', function(e){ var t = e.touches[0]; if(Math.abs(t.clientX-sx) > 8 || Math.abs(t.clientY-sy) > 8){ clearTimeout(timer); timer = null; } }, {passive:true});
  listEl.addEventListener('touchend', function(e){ if(timer === 'fired'){ e.preventDefault(); } clearTimeout(timer); timer = null; });
  listEl.addEventListener('contextmenu', function(e){ if(e.target.closest('.card')) e.preventDefault(); });
})();

$('q').addEventListener('input', function(){ query = this.value; render(); });
$('fileIn').addEventListener('change', function(){ handleFiles(this.files); this.value = ''; });
$('imgIn').addEventListener('change', function(){ handleFiles(this.files); this.value = ''; });

/* header shadow on scroll */
window.addEventListener('scroll', function(){ $('top').classList.toggle('scrolled', window.scrollY > 4); }, {passive:true});

/* רענון זמנים + קליטה אוטומטית כשחוזרים לאפליקציה */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  render();
  if(settings.auto) captureClipboard(true);
});
setInterval(function(){ if(document.visibilityState === 'visible' && !sheet.classList.contains('show')) render(); }, 60000);

/* באנר התקנה לאייפון */
function installHint(){
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!ios || standalone || settings.hint) return;
  $('bannerSlot').innerHTML = '<div class="banner"><div class="bi">'+svg('share')+'</div><p><b>התקן כאפליקציה</b>לחץ על כפתור השיתוף בדפדפן ואז "הוסף למסך הבית".</p><button class="x" data-a="dismissHint" aria-label="סגור">'+svg('x')+'</button></div>';
}

/* Service worker */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* init */
hydrateIcons(); applyTheme(); render(); installHint(); cleanOrphans();
if(window.matchMedia) try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme); } catch(e){}
})();
</script>
</body>
</html>
